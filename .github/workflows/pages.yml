name: Deploy WildStat to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The site build, the typechecks and the tests run side by side; the app
  # update and the deploy wait for all of them. One job ran them in a row in
  # about three and a half minutes, two of them the test suite.
  # No secrets and a read-only token in these three: they run npm installs.
  build:
    runs-on: ubuntu-latest
    outputs:
      app-bundle: ${{ steps.stage.outcome == 'success' && 'yes' || 'no' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            spacetimedb/package-lock.json

      - name: Validate and build client
        run: |
          npm ci
          npm ci --prefix mobile
          npm ci --prefix spacetimedb
          npm run check:release
          npm run build:client
          node scripts/check-client-build.mjs

      # The Android app's copy of the same dist. Off until automatic app updates
      # are turned on with: gh variable set OTA_AUTO_PUBLISH --body on
      # A failure here only skips the app update, never the website.
      - name: Stage Android app bundle
        id: stage
        if: vars.OTA_AUTO_PUBLISH == 'on'
        continue-on-error: true
        run: node mobile/scripts/build.mjs --skip-client-build

      - name: Keep site build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true
          retention-days: 1

      - name: Keep app bundle
        if: steps.stage.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-www
          path: mobile/www
          include-hidden-files: true
          retention-days: 1

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            spacetimedb/package-lock.json

      - name: Typecheck client and server
        run: |
          npm ci
          npm ci --prefix mobile
          npm ci --prefix spacetimedb
          npm run typecheck:coop
          npm run typecheck:server

  # The unit suite in four parts at once. Vitest splits the test files the same
  # way on every run, so a failing file always lands in the same part.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
            spacetimedb/package-lock.json

      - name: Unit tests, part ${{ matrix.shard }} of 4
        run: |
          npm ci
          # The shared unit suite includes native bridge tests.
          npm ci --prefix mobile
          npm ci --prefix spacetimedb
          npm run test:unit -- --shard=${{ matrix.shard }}/4

  deploy:
    needs: [build]
    # Deploy once the build, typechecks and tests passed, whether the app update ran, skipped or failed.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Restore site build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
          
      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
